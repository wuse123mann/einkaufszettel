name: Screenshots

# Startet die App in einem Android-Emulator, füllt sie mit Beispieldaten und
# legt die Screenshots unter docs/screenshots ab (für die README).
# Manuell neu erzeugen: Actions → Screenshots → Run workflow.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/src/androidTest/**"
      - ".github/workflows/screenshots.yml"

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: KVM für den Emulator freischalten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: App und Test bauen
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon

      - name: Screenshots im Emulator aufnehmen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          ram-size: 4096M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: |
            adb shell settings put global hide_error_dialogs 1
            sleep 25
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS
            adb shell cmd uimode night yes
            adb shell settings put global sysui_demo_allowed 1
            adb shell am broadcast -a com.android.systemui.demo -e command enter
            adb shell am broadcast -a com.android.systemui.demo -e command clock -e hhmm 0830
            adb shell am broadcast -a com.android.systemui.demo -e command battery -e level 100 -e plugged false
            adb shell am broadcast -a com.android.systemui.demo -e command network -e wifi show -e level 4 -e mobile show -e level 4
            adb shell am broadcast -a com.android.systemui.demo -e command notifications -e visible false
            gradle :app:connectedDebugAndroidTest --no-daemon

      - name: Screenshots einsammeln
        if: always()
        run: |
          mkdir -p neu docs/screenshots
          find app/build/outputs -path '*additional_output*' -name '*.png' -exec cp {} neu/ \; || true
          # Nur ersetzen, wenn der Test wirklich neue Bilder geliefert hat
          if ls neu/*.png >/dev/null 2>&1; then
            rm -f docs/screenshots/*.png
            cp neu/*.png docs/screenshots/
          fi
          ls -la docs/screenshots

      - name: Screenshots committen
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898296+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Keine Änderungen"
          else
            git commit -m "Screenshots aktualisiert"
            git pull --rebase
            git push
          fi
