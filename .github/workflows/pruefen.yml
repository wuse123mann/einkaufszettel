name: Zweig prüfen

# Baut jeden Zweig außer main - nur zum Kompilieren, ohne Release und ohne Versionsnummer zu
# verbrauchen. "APK bauen" laeuft weiterhin nur auf main und veroeffentlicht dort.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Debug-APK bauen
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      # Zum Ausprobieren am Handy, ohne dass daraus ein Release wird. Nach zwei Wochen weg.
      - uses: actions/upload-artifact@v4
        with:
          name: einkaufszettel-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
