name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: APK bauen
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk "Einkaufszettel-v1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Einkaufszettel-v1.0.${{ github.run_number }}
          path: Einkaufszettel-v1.0.${{ github.run_number }}.apk

      - name: Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Einkaufszettel v1.0.${{ github.run_number }}
          body: Automatisch gebaut aus ${{ github.sha }}. APK herunterladen und am Handy installieren.
          files: Einkaufszettel-v1.0.${{ github.run_number }}.apk
          make_latest: true
